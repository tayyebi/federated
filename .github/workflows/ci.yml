name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: macos-latest
            platform: macos
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release
      
    - name: Run Tests
      run: |
        cd build
        ./federated_tests
        
    - name: Run CTest
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Run E2E Tests
      run: |
        chmod +x tests/e2e/*.sh
        ./tests/e2e/run_all.sh
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: binaries-${{ matrix.platform }}
        path: |
          build/federated_tests
          build/simple_message
          build/federated
        retention-days: 30
